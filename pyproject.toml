[project]
name = "kmstca"
version = "0.1.0"
description = "The all-in-one government software for The Kingdom of Cassony"
readme = "README.md"
license = "BSD 2-Clause"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1",
    "django-minify-html>=1.14.0",
    "django-storages[s3]>=1.14.6",
    "environs>=15.1.0",
    "gunicorn>=26.1.0",
    "psycopg[pool]>=3.3.4",
    "shortuuid>=1.0.13",
    "wagtail>=7.4.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "python-semantic-release>=10.6.1",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "kmstca.settings.test"

[tool.ruff]
include = [
  "pyproject.toml",
  "kmstca/**/*.py",
  "home/**/*.py",
  "infodesk/**/*.py",
  "news/**/*.py",
  "search/**/*.py",
  "manage.py"
]
exclude = [
  "kmstca/migrations/*.py",
  "home/migrations/*.py",
  "infodesk/migrations/*.py",
  "news/migrations/*.py",
  "kmstca/settings/*.py"
]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.semantic_release]
allow_zero_version = true
major_on_zero = false
commit_message = "chore: Bump to version {version}\n\nAutomatically generated by python-semantic-release"
version_toml = ["pyproject.toml:project.version"]
